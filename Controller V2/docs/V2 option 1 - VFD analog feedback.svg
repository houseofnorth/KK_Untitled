<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="880" fill="#fff"/>
  <text x="40" y="42" font-size="22" font-weight="bold">Option 1: XIAO D1 / GPIO3 ← VFD analog feedback (terminal 8)</text>
  <text x="40" y="64" fill="#666" font-size="13">New parts and wiring in blue. Existing VFD wiring in grey. XIAO on the left, drive on the right.</text>

  <!-- ===== PCB ===== -->
  <rect x="35" y="100" width="720" height="440" rx="8" fill="none" stroke="#999" stroke-dasharray="8 6" stroke-width="1.5"/>
  <text x="50" y="122" fill="#999" font-weight="bold">V2 PCB</text>

  <!-- XIAO -->
  <rect x="50" y="270" width="120" height="120" rx="6" fill="#2d6a3e"/>
  <text x="110" y="296" text-anchor="middle" fill="#fff" font-weight="bold">XIAO ESP32C3</text>
  <rect x="154" y="320" width="16" height="20" fill="#e8c55a"/>
  <text x="146" y="326" fill="#fff" text-anchor="end">pad 2</text>
  <text x="146" y="341" fill="#fff" text-anchor="end" font-weight="bold">D1 / GPIO3</text>
  <text x="146" y="356" fill="#cde" text-anchor="end">ADC1_CH3 (A1)</text>

  <g stroke="#1a5fb4" stroke-width="2.5" fill="none">
    <!-- XIAO to R18 -->
    <line x1="170" y1="330" x2="400" y2="330"/>
    <!-- R18 -->
    <rect x="400" y="320" width="80" height="20" fill="#fff"/>
    <!-- R18 to connector pin 11 -->
    <line x1="480" y1="330" x2="618" y2="330"/>
    <!-- C5 at x=250 -->
    <line x1="250" y1="330" x2="250" y2="402"/><line x1="233" y1="402" x2="267" y2="402" stroke-width="3"/><line x1="233" y1="412" x2="267" y2="412" stroke-width="3"/><line x1="250" y1="412" x2="250" y2="490"/>
    <!-- R19 at x=335 -->
    <line x1="335" y1="330" x2="335" y2="380"/><rect x="325" y="380" width="20" height="60" fill="#fff"/><line x1="335" y1="440" x2="335" y2="490"/>
    <!-- D8 TVS at x=540 -->
    <line x1="540" y1="330" x2="540" y2="395"/><line x1="540" y1="425" x2="540" y2="490"/>
    <!-- pin 12 to GND -->
    <line x1="618" y1="365" x2="590" y2="365"/><line x1="590" y1="365" x2="590" y2="490"/>
    <!-- GND rail -->
    <line x1="250" y1="490" x2="590" y2="490"/>
  </g>
  <g fill="#1a5fb4"><circle cx="250" cy="330" r="4"/><circle cx="335" cy="330" r="4"/><circle cx="540" cy="330" r="4"/><circle cx="335" cy="490" r="4"/><circle cx="540" cy="490" r="4"/><circle cx="430" cy="490" r="4"/></g>

  <!-- net labels -->
  <text x="178" y="322" font-family="Menlo, monospace" font-size="11" fill="#1a5fb4">VFD_AO_SIG</text>
  <text x="610" y="322" text-anchor="end" font-family="Menlo, monospace" font-size="11" fill="#1a5fb4">VFD_AO_IN</text>

  <!-- C5 label -->
  <text x="230" y="400" text-anchor="end" font-weight="bold" fill="#1a5fb4">C5</text>
  <text x="230" y="415" text-anchor="end">100nF</text>
  <!-- R19 label -->
  <text x="315" y="405" text-anchor="end" font-weight="bold" fill="#1a5fb4">R19</text>
  <text x="315" y="420" text-anchor="end">10k</text>
  <!-- R18 label -->
  <text x="440" y="310" text-anchor="middle" font-weight="bold" fill="#1a5fb4">R18</text>
  <text x="440" y="357" text-anchor="middle">68k</text>
  <!-- D8 TVS symbol (cathode up) -->
  <polygon points="530,425 550,425 540,405" fill="#1a5fb4"/>
  <polyline points="526,399 530,405 550,405 554,411" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="520" y="412" text-anchor="end" font-weight="bold" fill="#1a5fb4">D8</text>
  <text x="520" y="426" text-anchor="end">SMF12A</text>
  <text x="520" y="440" text-anchor="end" fill="#666" font-size="11">TVS, optional</text>

  <!-- GND symbol -->
  <g stroke="#333" stroke-width="2"><line x1="430" y1="490" x2="430" y2="505"/><line x1="415" y1="505" x2="445" y2="505"/><line x1="421" y1="511" x2="439" y2="511"/><line x1="427" y1="517" x2="433" y2="517"/></g>
  <text x="452" y="514" font-weight="bold">GND</text>

  <!-- existing connector pins -->
  <g fill="#eee" stroke="#555"><rect x="618" y="160" width="22" height="20"/><rect x="618" y="195" width="22" height="20"/><rect x="618" y="230" width="22" height="20"/><rect x="618" y="265" width="22" height="20"/></g>
  <g fill="#888" font-family="Menlo, monospace" font-size="11" text-anchor="end">
    <text x="610" y="174">VFD_24V   MOTOR 7</text>
    <text x="610" y="209">VFD_DI1   MOTOR 8</text>
    <text x="610" y="244">VFD_OK_IN MOTOR 9</text>
    <text x="610" y="279">GND       MOTOR 10</text>
  </g>
  <!-- new connector pins -->
  <g fill="#dbe8f7" stroke="#1a5fb4" stroke-width="1.5"><rect x="618" y="320" width="22" height="20"/><rect x="618" y="355" width="22" height="20"/></g>
  <text x="629" y="314" text-anchor="middle" font-size="10" fill="#1a5fb4">11</text>
  <text x="629" y="391" text-anchor="middle" font-size="10" fill="#1a5fb4">12</text>
  <text x="742" y="515" text-anchor="end" font-size="11" fill="#1a5fb4" font-weight="bold">MOTOR 11 / 12</text>
  <text x="742" y="530" text-anchor="end" font-size="11" fill="#666">(12-pin, 3.81)</text>

  <!-- ===== cable + GX16-6 ===== -->
  <g stroke="#aaa" stroke-width="2"><line x1="640" y1="170" x2="820" y2="170"/><line x1="640" y1="205" x2="820" y2="205"/><line x1="640" y1="240" x2="820" y2="240"/><line x1="640" y1="275" x2="820" y2="275"/></g>
  <g stroke="#1a5fb4" stroke-width="3"><line x1="640" y1="330" x2="820" y2="330"/><line x1="640" y1="365" x2="820" y2="365"/></g>
  <rect x="820" y="145" width="50" height="245" rx="6" fill="#ddd" stroke="#333" stroke-width="2"/>
  <g font-size="11" text-anchor="middle"><text x="845" y="174">1</text><text x="845" y="209">2</text><text x="845" y="244">3</text><text x="845" y="279">4</text><text x="845" y="334" fill="#1a5fb4" font-weight="bold">5</text><text x="845" y="369" fill="#1a5fb4" font-weight="bold">6</text></g>
  <text x="845" y="410" text-anchor="middle" font-weight="bold">GX16-6</text>
  <text x="845" y="425" text-anchor="middle" fill="#666">(was GX16-4)</text>
  <g stroke="#aaa" stroke-width="2"><line x1="870" y1="170" x2="1025" y2="170"/><line x1="870" y1="205" x2="1025" y2="205"/><line x1="870" y1="240" x2="1025" y2="240"/><line x1="870" y1="275" x2="1025" y2="275"/></g>
  <g stroke="#1a5fb4" stroke-width="3"><line x1="870" y1="330" x2="1025" y2="330"/><line x1="870" y1="365" x2="1025" y2="365"/></g>

  <!-- ===== VFD terminal block ===== -->
  <text x="1030" y="118" font-size="14" font-weight="bold">VersiDrive i E2</text>
  <text x="1030" y="134" fill="#666">control terminals</text>
  <rect x="1030" y="145" width="110" height="245" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <g font-family="Menlo, monospace" font-size="11">
    <text x="1045" y="174" fill="#888">1  +24V</text>
    <text x="1045" y="209" fill="#888">2  DI1</text>
    <text x="1045" y="244" fill="#888">10 RLY</text>
    <text x="1045" y="279" fill="#888">11 RLY</text>
    <text x="1045" y="334" fill="#1a5fb4" font-weight="bold">8  AO</text>
    <text x="1045" y="369" fill="#1a5fb4" font-weight="bold">9  0V</text>
  </g>
  <g fill="#fff" stroke="#333"><circle cx="1030" cy="170" r="5"/><circle cx="1030" cy="205" r="5"/><circle cx="1030" cy="240" r="5"/><circle cx="1030" cy="275" r="5"/><circle cx="1030" cy="330" r="5"/><circle cx="1030" cy="365" r="5"/></g>

  <!-- ===== Tables ===== -->
  <text x="40" y="580" font-size="15" font-weight="bold">Parts added</text>
  <line x1="40" y1="588" x2="560" y2="588" stroke="#ccc"/>
  <g font-size="12">
    <text x="40" y="606" font-weight="bold">R18</text><text x="90" y="606">68k 0805</text><text x="230" y="606">series / top of divider</text>
    <text x="40" y="624" font-weight="bold">R19</text><text x="90" y="624">10k 0805</text><text x="230" y="624">bottom of divider (same part as R1)</text>
    <text x="40" y="642" font-weight="bold">C5</text><text x="90" y="642">100nF 0805</text><text x="230" y="642">ADC filter, τ ≈ 0.9 ms (same part as C1)</text>
    <text x="40" y="660" font-weight="bold">D8</text><text x="90" y="660">SMF12A SOD-123FL</text><text x="230" y="660">cable surge, optional</text>
    <text x="40" y="678" font-weight="bold">MOTOR</text><text x="110" y="678">12-pin header, pins 11 (VFD_AO_IN) and 12 (GND)</text>
    <text x="40" y="696" font-weight="bold">Panel</text><text x="110" y="696">GX16-4 → GX16-6 (VFD cable)</text>
  </g>

  <text x="620" y="580" font-size="15" font-weight="bold">Scaling</text>
  <line x1="620" y1="588" x2="1160" y2="588" stroke="#ccc"/>
  <g font-size="12">
    <text x="620" y="606">Divider ratio 10 / 78 = 0.128 → V(terminal 8) = V(pin) × 7.8</text>
    <text x="620" y="624">0 V → 0 V  ·  5 V → 0.64 V  ·  10 V → 1.28 V</text>
    <text x="620" y="642">If terminal 8 is ever set to digital (24 V): pin sees 3.08 V. Safe without a clamp diode.</text>
    <text x="620" y="668" font-weight="bold">Drive setting</text>
    <text x="620" y="686">P-25 selects what terminal 8 outputs, e.g. motor speed or motor current (0–10 V).</text>
    <text x="620" y="704" fill="#b00">Check the exact P-25 values in the VersiDrive manual.</text>
  </g>

  <text x="40" y="748" font-size="15" font-weight="bold">Firmware</text>
  <rect x="40" y="758" width="1120" height="62" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <g font-family="Menlo, monospace" font-size="12">
    <text x="55" y="780">constexpr uint8_t PIN_VFD_AO_SIG = D1; // GPIO3  net VFD_AO_SIG : VFD analog out (terminal 8) via 68k/10k divider</text>
    <text x="55" y="800">float vfdAo = analogReadMilliVolts(PIN_VFD_AO_SIG) * 7.8f / 1000.0f;  // volts at terminal 8, 0–10 V</text>
  </g>

  <text x="40" y="848" font-size="12" fill="#555">• Moved from GPIO2 to GPIO3 so the strapping pin GPIO2 stays high at reset (it now carries the button input with its 10k pull-up).</text>
  <text x="40" y="866" font-size="12" fill="#555">• This ties board GND to the VFD's 0 V (terminal 9). The drive's control terminals are isolated from mains.</text>
</svg>

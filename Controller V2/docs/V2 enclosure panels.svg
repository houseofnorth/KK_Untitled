<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#111">UNTITLED — Controller V2 enclosure panels</text>
  <text x="40" y="68" font-size="13" fill="#666">Front views, not to scale. Net names match the V2 schematic and firmware.</text>

  <!-- ================= 1. PANEL (signal side) ================= -->
  <text x="40" y="112" font-size="16" font-weight="bold" fill="#111">1 · PANEL — signal side  (board: PANEL, 10-pin 3.81)</text>
  <line x1="40" y1="120" x2="1160" y2="120" stroke="#ddd"/>
  <g transform="translate(-580,10)">
    <rect x="620" y="125" width="540" height="250" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <circle cx="690" cy="200" r="15" fill="#ccc" stroke="#333"/><circle cx="690" cy="200" r="9" fill="#2eaa4a"/>
    <text x="690" y="236" font-size="12" font-weight="bold" text-anchor="middle">BRAKE</text>
    <text x="690" y="251" font-size="10" fill="#555" text-anchor="middle">released</text>
    <circle cx="780" cy="200" r="15" fill="#ccc" stroke="#333"/><circle cx="780" cy="200" r="9" fill="#d33"/>
    <text x="780" y="236" font-size="12" font-weight="bold" text-anchor="middle">MOVE</text>
    <text x="780" y="251" font-size="10" fill="#555" text-anchor="middle">impulse</text>
    <circle cx="870" cy="200" r="15" fill="#ccc" stroke="#333"/><circle cx="870" cy="200" r="9" fill="#2eaa4a"/>
    <text x="870" y="236" font-size="12" font-weight="bold" text-anchor="middle">VFD OK</text>
    <text x="870" y="251" font-size="10" fill="#555" text-anchor="middle">status</text>
    <circle cx="985" cy="205" r="28" fill="#bbb" stroke="#333" stroke-width="2"/>
    <circle cx="985" cy="205" r="18" fill="#444"/>
    <rect x="982" y="189" width="6" height="32" rx="2" fill="#ddd"/>
    <text x="985" y="258" font-size="14" font-weight="bold" text-anchor="middle">RUN</text>
    <text x="985" y="274" font-size="11" fill="#555" text-anchor="middle">key / toggle, latching</text>
    <circle cx="1100" cy="205" r="20" fill="#bbb" stroke="#333" stroke-width="2"/>
    <circle cx="1100" cy="205" r="12" fill="#666" stroke="#333"/>
    <text x="1100" y="258" font-size="14" font-weight="bold" text-anchor="middle">WIFI / TEST</text>
    <text x="1100" y="274" font-size="11" fill="#555" text-anchor="middle">momentary, recessed</text>
    <circle cx="1100" cy="318" r="15" fill="#ccc" stroke="#333"/><circle cx="1100" cy="318" r="9" fill="#e6b800"/>
    <text x="1100" y="352" font-size="12" font-weight="bold" text-anchor="middle">SYSTEM</text>
    <text x="1100" y="366" font-size="10" fill="#555" text-anchor="middle">mirrors LED4</text>
    <rect x="650" y="300" width="70" height="30" rx="8" fill="none" stroke="#777" stroke-dasharray="5 4" stroke-width="2"/>
    <rect x="668" y="310" width="34" height="10" rx="5" fill="#999"/>
    <text x="732" y="312" font-size="12" font-weight="bold">USB-C (optional)</text>
    <text x="732" y="328" font-size="11" fill="#555">panel extension to XIAO, for flashing if OTA fails</text>
  </g>
  <g font-size="12" fill="#111" transform="translate(0,-265)">
    <text x="620" y="410" font-weight="bold">PANEL header (10-pin)</text>
    <line x1="620" y1="418" x2="1160" y2="418" stroke="#ccc"/>
    <text x="620" y="436">1</text><text x="650" y="436" font-family="Menlo, monospace">RUN_IN</text><text x="790" y="436">RUN switch</text>
    <text x="620" y="454">2</text><text x="650" y="454" font-family="Menlo, monospace">GND</text><text x="790" y="454">RUN switch</text>
    <text x="620" y="472">3</text><text x="650" y="472" font-family="Menlo, monospace">BTN_IN</text><text x="790" y="472">WIFI / TEST button</text>
    <text x="620" y="490">4</text><text x="650" y="490" font-family="Menlo, monospace">GND</text><text x="790" y="490">WIFI / TEST button</text>
    <text x="620" y="508">5</text><text x="650" y="508" font-family="Menlo, monospace">PLED_BRAKE</text><text x="790" y="508">BRAKE LED anode</text>
    <text x="620" y="526">6</text><text x="650" y="526" font-family="Menlo, monospace">PLED_MOVE</text><text x="790" y="526">MOVE LED anode</text>
    <text x="620" y="544">7</text><text x="650" y="544" font-family="Menlo, monospace">PLED_VFD_OK</text><text x="790" y="544">VFD OK LED anode</text>
    <text x="620" y="562">8</text><text x="650" y="562" font-family="Menlo, monospace">GND</text><text x="790" y="562">BRAKE / MOVE / VFD OK cathodes</text>
    <text x="620" y="580">9</text><text x="650" y="580" font-family="Menlo, monospace">PLED_SYS</text><text x="790" y="580">SYSTEM LED anode (3.3 V via R20 220R)</text>
    <text x="620" y="598">10</text><text x="650" y="598" font-family="Menlo, monospace">LED_SYS</text><text x="790" y="598">SYSTEM LED cathode → GPIO8 (active low)</text>
  </g>

  <!-- ================= 2. MOTOR (power side) ================= -->
  <text x="40" y="432" font-size="16" font-weight="bold" fill="#111">2 · MOTOR — power side  (board: MOTOR, 12-pin 3.81 — supplies, brake, VFD)</text>
  <line x1="40" y1="440" x2="1160" y2="440" stroke="#ddd"/>
  <g transform="translate(0,330)">
    <rect x="40" y="125" width="540" height="250" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <rect x="75" y="185" width="120" height="100" rx="6" fill="#333"/>
    <path d="M100 215 h70 v30 l-12 18 h-46 l-12 -18 z" fill="#111" stroke="#666"/>
    <rect x="112" y="230" width="6" height="16" fill="#bbb"/><rect x="132" y="224" width="6" height="16" fill="#bbb"/><rect x="152" y="230" width="6" height="16" fill="#bbb"/>
    <rect x="110" y="192" width="50" height="16" rx="2" fill="#c33"/>
    <text x="135" y="204" font-size="10" fill="#fff" text-anchor="middle">I / O</text>
    <rect x="165" y="268" width="24" height="12" fill="#777"/>
    <text x="135" y="310" font-size="14" font-weight="bold" text-anchor="middle">MAINS IN</text>
    <text x="135" y="328" font-size="11" fill="#555" text-anchor="middle">IEC C14 + switch + fuse</text>
    <circle cx="330" cy="235" r="40" fill="#bbb" stroke="#333" stroke-width="2"/>
    <circle cx="330" cy="235" r="30" fill="#222"/>
    <rect x="326" y="200" width="8" height="8" fill="#bbb"/>
    <g fill="#e8c55a">
      <circle cx="316" cy="222" r="3.5"/><circle cx="344" cy="222" r="3.5"/><circle cx="350" cy="241" r="3.5"/>
      <circle cx="330" cy="253" r="3.5"/><circle cx="310" cy="241" r="3.5"/><circle cx="330" cy="236" r="3.5"/>
    </g>
    <g font-size="8" fill="#fff"><text x="306" y="219">1</text><text x="349" y="219">2</text><text x="356" y="249">3</text><text x="327" y="266">4</text><text x="301" y="249">5</text><text x="336" y="233">6</text></g>
    <text x="330" y="310" font-size="14" font-weight="bold" text-anchor="middle">VFD</text>
    <text x="330" y="328" font-size="11" fill="#555" text-anchor="middle">GX16-6</text>
    <circle cx="475" cy="235" r="40" fill="#bbb" stroke="#333" stroke-width="2"/>
    <circle cx="475" cy="235" r="30" fill="#222"/>
    <rect x="471" y="200" width="8" height="8" fill="#bbb"/>
    <circle cx="462" cy="238" r="4.5" fill="#e8c55a"/><circle cx="488" cy="238" r="4.5" fill="#e8c55a"/>
    <text x="452" y="232" font-size="9" fill="#fff">1</text><text x="494" y="232" font-size="9" fill="#fff">2</text>
    <text x="475" y="310" font-size="14" font-weight="bold" text-anchor="middle">BRAKE</text>
    <text x="475" y="328" font-size="11" fill="#555" text-anchor="middle">GX16-2</text>
  </g>
  <g font-size="12" fill="#111" transform="translate(580,65)">
    <text x="40" y="410" font-weight="bold">MAINS IN</text>
    <text x="40" y="428">L / N / PE → 2 × Mean Well IRM (24 V and 5 V), inside.</text>
    <text x="40" y="446" fill="#555">IRM outputs → MOTOR 1–4 (5V, GND, 24V+, 24V-).</text>

    <text x="40" y="482" font-weight="bold">VFD  (GX16-6 → VersiDrive, multicore)</text>
    <line x1="40" y1="490" x2="580" y2="490" stroke="#ccc"/>
    <text x="40" y="508">1</text><text x="70" y="508" font-family="Menlo, monospace">VFD_24V</text><text x="200" y="508">T1  +24V out</text><text x="420" y="508" fill="#555">MOTOR 7</text>
    <text x="40" y="526">2</text><text x="70" y="526" font-family="Menlo, monospace">VFD_DI1</text><text x="200" y="526">T2  DI1 run input (K2)</text><text x="420" y="526" fill="#555">MOTOR 8</text>
    <text x="40" y="544">3</text><text x="70" y="544" font-family="Menlo, monospace">VFD_OK_IN</text><text x="200" y="544">T10 relay contact</text><text x="420" y="544" fill="#555">MOTOR 9</text>
    <text x="40" y="562">4</text><text x="70" y="562" font-family="Menlo, monospace">GND</text><text x="200" y="562">T11 relay common</text><text x="420" y="562" fill="#555">MOTOR 10</text>
    <text x="40" y="580">5</text><text x="70" y="580" font-family="Menlo, monospace">VFD_AO_IN</text><text x="200" y="580">T8  analog out 0–10 V</text><text x="420" y="580" fill="#555">MOTOR 11</text>
    <text x="40" y="598">6</text><text x="70" y="598" font-family="Menlo, monospace">GND</text><text x="200" y="598">T9  0V</text><text x="420" y="598" fill="#555">MOTOR 12</text>

    <text x="40" y="634" font-weight="bold">BRAKE  (GX16-2 → spring brake coil, 2-pole cable)</text>
    <line x1="40" y1="642" x2="580" y2="642" stroke="#ccc"/>
    <text x="40" y="660">1</text><text x="70" y="660" font-family="Menlo, monospace">BRAKE+</text><text x="200" y="660">+24 V switched by K1</text><text x="420" y="660" fill="#555">MOTOR 5</text>
    <text x="40" y="678">2</text><text x="70" y="678" font-family="Menlo, monospace">BRAKE-</text><text x="200" y="678">coil return (net 24V-)</text><text x="420" y="678" fill="#555">MOTOR 6</text>
  </g>

  <!-- Notes -->
  <g font-size="12" fill="#111">
    <line x1="40" y1="768" x2="1160" y2="768" stroke="#ddd"/>
    <text x="40" y="790" font-weight="bold">Notes</text>
    <text x="40" y="810">• The VFD (6-pin) and BRAKE (2-pin) connectors have different pin counts, so their cables can't be swapped.</text>
    <text x="40" y="828">• Panel LEDs: bare 5 mm LEDs in bezels (the board already has 220R). No 12/24 V indicators with built-in resistors. Red, green or yellow only.</text>
    <text x="40" y="846">• RUN and WIFI are 3.3 V, low-current signals, so gold-contact or signal-rated switches work best. A key switch for RUN stops visitors switching it off.</text>
    <text x="40" y="864">• Keep mains wiring (inlet → IRM supplies) physically separated from the PCB and the signal-panel wiring.</text>
    <text x="40" y="882">• VersiDrive: set P-25 so terminal 8 outputs motor speed or current (0–10 V). Check the values in the manual.</text>
  </g>
</svg>
